<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="devoir">

    <input type="checkbox" name="devoir" value="Devoir1"> Devoir1 <br>

     <button type="submit" class="btn">Continuer</button>
    </form>

</html>
