<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tableau</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="tableau">
    <h1>Entrer les notes</h1> <br>

    <form action="{{ url_for('resultat') }}" method="post">
        <table border="1">
            
            <tr>
                <th>Matières</th>
                {% for devoir in devoirs %}
                  <th> {{ devoir}} </th>
                {% endfor %}
                <th>Composition</th>
                <th>Coefficient</th>
            </tr>
            
        {% for matiere in matieres %}
            {% set m= matiere.lower().replace("-", "-") %}
            
            <tr>
                <td><b>{{ matiere }}</b>
                <input type="hidden" name="matiere" value="{{ matiere }}">
                </td>
                {% for devoir in devoirs %}
                    <td>
                        <input type="number" name="note_{{ m }}_{{ devoir }}" min="0" max="20" step="0.01">
                     </td>
                {% endfor %}
                <td>
                    <input type="number" name="composition_{{ m }}" min="0" max="20" step="0.01" required>
                </td>
                <td>
                    <input type="number" name="coef_{{ m }}" min="1" step="1" required>
                </td>
            </tr>
        {% endfor %}

        </table>
        <br>
        <button type="submit" class="btn">Calculer</button>

    </form>
    
</body>
</html>
